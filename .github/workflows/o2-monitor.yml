name: O2 NW9 0RY Network Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run O2 diagnostic monitor
        run: npm run monitor
        env:
          CI: true

      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "GENERATED DATA FILES"
          echo "========================================"
          ls -lah data || true

          echo ""
          echo "========================================"
          echo "GENERATED EVIDENCE FILES"
          echo "========================================"
          ls -lah evidence || true

      - name: Show latest CSV
        if: always()
        run: |
          echo "========================================"
          echo "LATEST O2 MONITOR CSV"
          echo "========================================"

          if [ -f data/o2-nw9-0ry-monitor.csv ]; then
            tail -n 5 data/o2-nw9-0ry-monitor.csv
          else
            echo "CSV file not found."
          fi

      - name: Commit evidence
        if: always()
        run: |
          git config user.name "O2 Mast Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ evidence/

          if git diff --cached --quiet; then
            echo "No new evidence to commit."
          else
            git commit -m "O2 NW9 0RY diagnostic check $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
