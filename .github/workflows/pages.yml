```yaml
name: Deploy O2 NW9 Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
          cp -R data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
